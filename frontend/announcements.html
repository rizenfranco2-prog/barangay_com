<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Announcements • Barangay Connect</title>

    <link rel="icon"
          href="favicon.ico"
          type="image/x-icon">

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bc-redesign.css?v=sticky-final4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>


<body class="app-body">


    <header class="topbar">

        <button type="button"
                class="mobile-menu-toggle"
                id="mobileMenuToggle"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="mobileSidebar">
            ☰
        </button>

        <a class="top-brand"
           href="dashboard.html">
            <span>BC</span>
            Barangay Connect
        </a>


        <div class="top-user">

            <div class="clickable-profile">


                <span class="avatar tiny" id="topAvatar">
                    U
                </span>

                <span id="topName">
                    User
                </span>

            </div>


            <button class="icon-btn"
                    id="logoutBtn">
                Logout
            </button>

        </div>

    </header>





    <div class="layout">


        <!-- SIDEBAR -->

        <aside class="sidebar" id="mobileSidebar">


            <div class="profile-mini">

                <span class="avatar large"
                      id="profileAvatar">
                    U
                </span>


                <strong id="profileName">
                    User
                </strong>


                <small id="profileEmail">
                    email
                </small>

            </div>


            <nav>


                <a class="nav-item"
                   href="dashboard.html">
                    ⌂
                    <span>Community Feed</span>
                </a>



                <a class="nav-item active"
                   href="announcements.html">
                    📢
                    <span>Announcements</span>
                </a>

                <a href="officials.html" class="nav-link">
                    🏛️ <span>Officials</span>
                </a>


                <a class="nav-item" href="about.html">
                    ℹ️
                    <span>About Us</span>
                </a>

                <a class="nav-item" href="contact.html">
                    📞
                    <span>Contact</span>
                </a>


            </nav>

        </aside>



        <!-- MAIN -->

        <main class="feed">


            <section class="welcome">

                <div>
                    <p class="eyebrow">
                        BARANGAY ANNOUNCEMENTS
                    </p>

                    <h1>
                        Official Barangay Announcements
                    </h1>

                    <p class="muted">
                        Important announcements and updates from the barangay.
                    </p>
                </div>

                <div id="adminAnnouncementControls"></div>

            </section>


            <div id="announcementList" class="announcement-list">
                <div class="loading">
                    Loading announcements...
                </div>
            </div>



        </main>

    </div>


    <!-- CHANGE PASSWORD -->

    <div class="modal hidden"
         id="passwordModal">

        <div class="modal-card">

            <button class="close"
                    data-close="passwordModal">
                ×
            </button>


            <h2>
                Change password
            </h2>


            <form id="passwordForm">


                <label>
                    Current password
                </label>

                <input id="currentPassword"
                       type="password"
                       required>


                <label>
                    New password
                </label>

                <input id="newPassword"
                       type="password"
                       minlength="6"
                       required>


                <label>
                    Confirm new password
                </label>

                <input id="confirmPassword"
                       type="password"
                       minlength="6"
                       required>


                <button class="primary-btn"
                        type="submit">
                    Update password
                </button>


                <p class="form-message"
                   id="passwordMessage"></p>

            </form>

        </div>

    </div>


    <div class="toast"
         id="toast"></div>


    <script src="config.js"></script>
    <script src="announcements.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const toggle = document.getElementById("mobileMenuToggle");
            const sidebar = document.getElementById("mobileSidebar");
            const closeButton = document.getElementById("mobileMenuClose");

            if (!toggle || !sidebar) return;

            function closeMenu() {
                document.body.classList.remove("mobile-menu-open");
                toggle.setAttribute("aria-expanded", "false");
                toggle.setAttribute("aria-label", "Open navigation menu");
            }

            function openMenu() {
                document.body.classList.add("mobile-menu-open");
                toggle.setAttribute("aria-expanded", "true");
                toggle.setAttribute("aria-label", "Close navigation menu");
            }

            toggle.addEventListener("click", () => {
                const isOpen = document.body.classList.contains("mobile-menu-open");
                isOpen ? closeMenu() : openMenu();
            });

            // Make the X button close the sidebar
            if (closeButton) {
                closeButton.addEventListener("click", (event) => {
                    event.preventDefault();
                    closeMenu();
                });
            }

            // Close when a navigation link is selected
            sidebar.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", closeMenu);
            });

            // Close when Escape is pressed
            document.addEventListener("keydown", event => {
                if (event.key === "Escape") closeMenu();
            });
        });
    </script>

</body>
</html>
